services:
  - type: web
    name: chiro-dashboard
    env: node
    region: singapore
    buildCommand: npm install && npx turbo run build --filter=@chiro/dashboard
    startCommand: npm run start --workspace apps/dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chiro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chiro-redis
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: APP_URL
        sync: false

  - type: worker
    name: chiro-bot
    env: node
    region: singapore
    buildCommand: npm install && npx turbo run build --filter=@chiro/bot
    startCommand: npm run start --workspace apps/bot
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chiro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chiro-redis
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: BOT_OWNER_IDS
        sync: false

  - type: redis
    name: chiro-redis
    region: singapore
    ipAllowList: []
    plan: free

databases:
  - name: chiro-db
    databaseName: chiro
    user: chiro_user
    region: singapore
    plan: free
