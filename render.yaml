services:
  # ── Dashboard (Next.js web app) ───────────────────────────────────────────
  - type: web
    name: chiro-dashboard
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run db:generate && npm run build --workspace=apps/dashboard
    startCommand: node apps/dashboard/.next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chiro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chiro-redis
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: BOT_OWNER_IDS
        sync: false

  # ── Bot (Discord.js worker, exposed as web for free tier) ─────────────────
  - type: web
    name: chiro-bot
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run db:generate && npm run build --workspace=apps/bot
    startCommand: node apps/bot/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chiro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chiro-redis
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: BOT_OWNER_IDS
        sync: false
      - key: APP_URL
        sync: false

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: chiro-redis
    region: singapore
    ipAllowList: []
    plan: free

# ── PostgreSQL ────────────────────────────────────────────────────────────
databases:
  - name: chiro-db
    databaseName: chiro
    user: chiro_user
    region: singapore
    plan: free
